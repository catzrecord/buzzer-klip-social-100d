name: Buzzer Klip Instagram Cloud Publisher

on:
  schedule:
    # Early probe: normally exits without publishing, but covers delayed GitHub schedules.
    - cron: "7 23 * * *"
    # Primary daily run at 09:07 WIB.
    - cron: "7 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify or publish the Buzzer Klip queue"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - preflight
          - due
          - publish-id
      post_id:
        description: "Queue ID used only with publish-id"
        required: false
        type: string
      force_token_refresh:
        description: "Rotate and persist the renewable Meta token during this run"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: buzzer-klip-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_TOKEN_ENCRYPTION_KEY: ${{ secrets.META_TOKEN_ENCRYPTION_KEY }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      PUBLIC_ASSET_BASE_URL: ${{ secrets.PUBLIC_ASSET_BASE_URL || 'https://catzrecord.github.io/buzzer-klip-social-100d' }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
      META_GRAPH_HOST: ${{ vars.META_GRAPH_HOST || 'graph.instagram.com' }}
      META_DISCLOSE_AI: "true"
      META_TOKEN_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_token_refresh || 'false' }}
      BUZZER_KLIP_PUBLISH_MODE: ${{ github.event_name == 'schedule' && 'due' || inputs.mode }}
      BUZZER_KLIP_POST_ID: ${{ inputs.mode == 'publish-id' && inputs.post_id || '' }}

    steps:
      - name: Check out the queue
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate cloud configuration
        run: |
          test -n "$META_ACCESS_TOKEN"
          test -n "$META_TOKEN_ENCRYPTION_KEY"
          test -n "$INSTAGRAM_USER_ID"
          test -n "$PUBLIC_ASSET_BASE_URL"
      - name: Validate queue and final assets
        run: npm run validate:assets
      - name: Prepare renewable Meta token
        id: token
        run: node scripts/prepare_meta_token.mjs
      - name: Verify or publish
        id: publisher
        run: node scripts/publish_due.mjs
      - name: Rebuild public queue dashboard
        if: contains(fromJSON('["published","already_published"]'), steps.publisher.outputs.result)
        run: npm run build
      - name: Save publishing ledger and encrypted token state
        id: ledger
        if: steps.token.outputs.state_changed == 'true' || contains(fromJSON('["published","already_published"]'), steps.publisher.outputs.result)
        env:
          PUBLISH_RESULT: ${{ steps.publisher.outputs.result }}
          POST_ID: ${{ steps.publisher.outputs.post_id }}
        run: |
          PAGES_CHANGED=false
          git config user.name "buzzer-klip-publisher[bot]"
          git config user.email "buzzer-klip-publisher@users.noreply.github.com"
          git add .state/meta-token.enc
          if [[ "$PUBLISH_RESULT" == "published" || "$PUBLISH_RESULT" == "already_published" ]]; then
            git add content-plan.json public/content-plan.json public/index.html
            PAGES_CHANGED=true
          fi
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "pages_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PUBLISH_RESULT" == "published" || "$PUBLISH_RESULT" == "already_published" ]]; then
            git commit -m "chore: record Buzzer Klip Instagram post $POST_ID"
          else
            git commit -m "chore: persist renewable Instagram token state"
          fi
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "pages_changed=$PAGES_CHANGED" >> "$GITHUB_OUTPUT"
      - name: Refresh public queue dashboard
        if: steps.ledger.outputs.committed == 'true' && steps.ledger.outputs.pages_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Buzzer Klip Instagram publisher"
            echo "- Result: \`${{ steps.publisher.outputs.result || 'workflow_failed' }}\`"
            echo "- Post ID: \`${{ steps.publisher.outputs.post_id || '-' }}\`"
            echo "- Type: \`${{ steps.publisher.outputs.post_type || '-' }}\`"
            echo "- Assets: \`${{ steps.publisher.outputs.asset_count || '-' }}\`"
            echo "- Instagram: ${{ steps.publisher.outputs.instagram_url || '-' }}"
            echo "- Account: \`${{ steps.publisher.outputs.username || '-' }}\`"
            echo "- Token: \`${{ steps.token.outputs.refresh_status || 'not_checked' }}\`"
            echo "- Token lifetime: \`${{ steps.token.outputs.expires_in_days || '-' }} days\`"
          } >> "$GITHUB_STEP_SUMMARY"
