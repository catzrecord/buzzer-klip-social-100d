name: Temporary encrypted Meta token transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_TOKEN_ENCRYPTION_KEY: ${{ secrets.META_TOKEN_ENCRYPTION_KEY }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
      META_GRAPH_HOST: ${{ vars.META_GRAPH_HOST || 'graph.instagram.com' }}
      META_TOKEN_FORCE_REFRESH: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Load and verify renewable Meta token
        run: node scripts/prepare_meta_token.mjs

      - name: Encrypt token for one-time transfer
        env:
          TRANSFER_PUBLIC_KEY_B64: 
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const token = process.env.META_ACCESS_TOKEN;
          if (!token) throw new Error("META_ACCESS_TOKEN is empty");
          const publicKey = Buffer.from(process.env.TRANSFER_PUBLIC_KEY_B64, "base64").toString("utf8");
          const encrypted = crypto.publicEncrypt(
            {
              key: publicKey,
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: "sha256",
            },
            Buffer.from(token, "utf8"),
          );
          fs.writeFileSync("meta-token.enc.b64", `${encrypted.toString("base64")}\n`, { mode: 0o600 });
          NODE

      - name: Upload encrypted transfer package
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-meta-token
          path: meta-token.enc.b64
          retention-days: 1
          if-no-files-found: error
